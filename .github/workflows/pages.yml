name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check the site
        run: python3 site/tests/check_site.py

      - name: Assemble public files
        # Publish the page and its assets only; internal docs and tests stay out.
        run: |
          mkdir -p _site
          rsync -a \
            --exclude 'README.md' \
            --exclude 'CONTENT-CHECKLIST.md' \
            --exclude 'tests/' \
            --exclude '.DS_Store' \
            site/ _site/
          touch _site/.nojekyll
          find _site -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
